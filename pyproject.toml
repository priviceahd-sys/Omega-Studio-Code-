[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-code-studio"
version = "2.0.0"
description = "Omega Code Studio — IDE algorithmique moderne (successeur d'Alg_32 / Alg'exec) conçu pour Omarchy / Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Omega Code Studio"}
]
dependencies = [
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
omega-code-studio = "omega_studio.__main__:main"
omega-studio = "omega_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["omega_studio*"]

[tool.setuptools.package-data]
omega_studio = ["resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
